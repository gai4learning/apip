[project]
name = "cuhk-apip-learning-tool"
version = "0.2.0"
description = "Local-only Streamlit learning tool for CUHK Foundry APIs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit==1.61.1",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
